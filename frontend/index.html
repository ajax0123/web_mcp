<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  PP-M7: no runtime Tailwind compiler, no external CDN, no 'unsafe-eval'.
  Styles are precompiled and self-hosted (./app.css). This <meta> CSP is a
  defence-in-depth backstop; the AUTHORITATIVE CSP is the HTTP response header
  set by the serving layer:
    - dev   : frontend/serve.py  (CYBERGUARD_CONNECT_SRC env var)
    - Vercel : frontend/vercel.json `headers` (pin connect-src to your API origin)
  `connect-src` here allows localhost + any https host so the same static bundle
  works whether the API is on localhost:8000, Render, Railway, etc.; the serving
  layer's header narrows it to the one real origin.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000 https:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" />
<title>CyberGuard — Security Intelligence</title>
<!--
  Phase 4 — Interactive Investigation Dashboard.

  RUN (zero-build — no npm, no Vite dev server):
    Terminal 1 (API):   cd web_mcp && APP_ENV=dev uvicorn cyberguard_api.main:app --port 8000
    Terminal 2 (this):  cd web_mcp/frontend && python3 serve.py 5173
    Browser:            http://localhost:5173/

  serve.py serves the committed production bundle in frontend/dist/ (built from
  app.jsx via `npm run build`). Rebuild only when app.jsx / app.css change.
  Devs may still `npm install && npm run dev` for hot reload.

  Configure the API target + per-operator key by editing /config.js
  (served verbatim from frontend/public/config.js — never bundled, no secret here).
-->
<link rel="stylesheet" href="./app.css" />
<script src="/config.js"></script>
</head>
<body class="app">
  <div id="root"></div>
<script type="module" src="./app.jsx"></script>
</body>
</html>
