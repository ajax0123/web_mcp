<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  PP-M7: no runtime Tailwind compiler, no external CDN, no 'unsafe-eval'.
  Styles are precompiled and self-hosted (./app.css). This <meta> CSP is a
  defence-in-depth backstop; the authoritative CSP is the HTTP response header
  set by the serving layer (frontend/serve.py in dev, nginx/CDN in prod), which
  can also send HSTS / X-Frame-Options / etc.
  `connect-src` is widened at runtime by app.jsx to whatever CYBERGUARD_CONFIG.apiBase
  resolves to — keep it in sync when you deploy the API elsewhere.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8000; base-uri 'none'; form-action 'none'; object-src 'none'" />
<title>CyberGuard — Security Intelligence</title>
<!--
  Phase 4 — Interactive Investigation Dashboard. Imports ./webmcp_bridge.js (ES module).

  RUN (dev):
    Terminal 1 (API):   cd web_mcp && uvicorn cyberguard_api.main:app --port 8000
    Terminal 2 (this):  cd web_mcp/frontend && python3 serve.py 5173
    Browser:            http://localhost:5173/index.html

  Configure the API target + per-operator key by editing ./config.js
  (or templating it from the deploy). No secret is baked into this file.
-->
<link rel="stylesheet" href="./app.css" />
<script src="./config.js"></script>
</head>
<body class="app">
  <div id="root"></div>
<script type="module" src="./app.jsx"></script>
</body>
</html>
