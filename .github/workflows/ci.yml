name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * *"   # nightly pip-audit for CVE drift

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The git repository root IS the project root: this file is at
    # .github/workflows/ci.yml, with cyberguard_api/, frontend/, Dockerfile,
    # pyproject.toml as siblings. There is NO `web_mcp/` sub-directory in the
    # checkout, so there is no `working-directory` override and no
    # `web_mcp/`-prefixed paths (that mismatch is what broke setup-python:
    # "The specified python version file at: web_mcp/.python-version doesn't exist").
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true          # harmless when the .pkl blobs are plain; needed after an lfs migrate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # keep in sync with .python-version / pyproject.toml (>=3.11,<3.13)
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Lint (ruff — config in pyproject.toml, A-M3)
        run: |
          python -m pip install --quiet 'ruff==0.6.9'
          ruff check .

      - name: Resolve the hash-locked requirement set
        run: |
          # pip-tools 7.4.1 uses pip internals removed in pip >= 25.1
          # (PackageFinder.allow_all_prereleases / stdlib_pkgs), so pin pip below
          # that line before invoking pip-compile.
          python -m pip install --quiet 'pip<25.1' 'pip-tools==7.4.1'
          pip-compile --quiet --generate-hashes --allow-unsafe \
            --output-file requirements.lock cyberguard_api/requirements.txt

      - name: Lockfile is in sync (fails if requirements.txt changed without re-locking)
        run: |
          if [ -f requirements.committed.lock ]; then
            diff -u requirements.committed.lock requirements.lock \
              || { echo "::error::commit the regenerated requirements.lock"; exit 1; }
          fi

      - name: Clean install with hash verification
        run: pip install --no-cache-dir --require-hashes -r requirements.lock

      - name: Model artifact integrity gate
        run: python -m cyberguard_api.services.model_loader --check

      - name: Fresh-clone import check (C-1)
        run: PYTHON=python scripts/fresh_clone_check.sh

      - name: Tests
        run: |
          # pytest is the `dev` extra in pyproject.toml, not part of the
          # hash-locked runtime set installed above; pin it to the same version.
          python -m pip install --quiet 'pytest==8.3.3'
          python -m pytest

      - name: Docker image builds (A-H1)
        run: docker build -t cyberguard-api:ci .

      - name: Dependency CVE audit
        run: |
          python -m pip install --quiet 'pip-audit==2.7.3'
          pip-audit -r requirements.lock $( [ -f .pip-audit-ignore ] && sed 's/^/--ignore-vuln /' .pip-audit-ignore )
